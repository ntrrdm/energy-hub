<html lang="ru">

  <style>
    :root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172638;background:#f3f6f8;--ink:#172638;--muted:#647487;--line:#dce5eb;--teal:#008f87;--navy:#13283b;--amber:#d88a18;--red:#c64d43;--blue:#4d76bd}

    .app{display:grid;grid-template-columns:246px 1fr;min-height:100vh}.side{background:#102537;color:#d7e4ec;padding:24px 16px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;align-items:center;gap:12px;padding:3px 10px;color:white;font-weight:800;font-size:20px;letter-spacing:-.5px}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#00a99e;color:#fff;font-size:24px}.side-caption{font-size:11px;text-transform:uppercase;letter-spacing:1.7px;color:#8ba2b2;padding:0 12px;margin-bottom:10px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#bed0db;text-align:left;padding:12px;border-radius:9px;display:flex;gap:12px;align-items:center;width:100%}.nav button:hover,.nav button.active{background:#214056;color:#fff}.nav .ico{width:19px;text-align:center;font-size:17px}.side-bottom{margin-top:auto;padding:14px 12px;border-top:1px solid #2a4557;color:#a6bdc9;font-size:12px;line-height:1.5}
    main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:18px}.crumb{font-size:13px;color:var(--muted)}.crumb strong{display:block;color:var(--ink);font-size:18px;margin-top:2px}.top-actions{display:flex;align-items:center;gap:12px}.role-select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;color:var(--ink);font-weight:600}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#dcefed;color:#057b75;font-weight:800}.content{padding:28px 32px 52px;max-width:1510px;margin:auto}.eyebrow{font-size:11px;text-transform:uppercase;color:var(--teal);letter-spacing:1.5px;font-weight:800}.heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.heading h1{font-size:30px;line-height:1.2;letter-spacing:-.8px;margin:5px 0 7px}.sub{color:var(--muted);font-size:14px;margin:0}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 15px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{border-color:#9db5c3;background:#f8fbfc}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn.primary:hover{background:#007d77}.btn.small{padding:7px 11px;font-size:12px}.btn.ghost{background:transparent}.stack{display:grid;gap:18px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 9px rgba(19,40,59,.025)}.metric{padding:19px 20px;min-height:125px}.label{font-size:12px;color:var(--muted);font-weight:650}.metric .value{font-size:27px;font-weight:800;letter-spacing:-.8px;margin:11px 0 5px;white-space:nowrap}.metric .detail{font-size:12px;color:var(--muted)}.metric .detail.bad{color:var(--red)}.metric .detail.good{color:var(--teal)}.card-head{padding:20px 22px 13px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.card-title{font-size:17px;font-weight:800;letter-spacing:-.25px}.card-sub{font-size:12px;color:var(--muted);margin-top:4px}.card-body{padding:4px 22px 22px}.query-card{padding:18px;display:flex;flex-direction:column;gap:14px;min-height:145px}.query-card .qicon{font-size:21px}.query-card strong{font-size:15px}.query-card p{font-size:12px;color:var(--muted);line-height:1.45;margin:0;flex:1}.query-card button{align-self:flex-start}.site-list,.object-list,.feed{display:grid}.site-row,.object-row,.feed-row{display:flex;align-items:center;gap:14px;padding:16px 22px;border-top:1px solid #edf1f3}.site-row:first-child,.object-row:first-child,.feed-row:first-child{border-top:0}.site-row:hover,.object-row:hover{background:#f9fbfc}.site-icon,.object-icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:#e7f3f1;color:#047f79;font-size:19px;flex:none}.row-main{flex:1;min-width:0}.row-main strong{display:block;font-size:14px}.row-main span{font-size:12px;color:var(--muted);display:block;margin-top:4px}.row-num{text-align:right;white-space:nowrap}.row-num strong{font-size:15px}.row-num span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.pill{border-radius:20px;padding:5px 9px;font-size:11px;font-weight:800;white-space:nowrap}.pill.good{background:#e1f3ed;color:#178066}.pill.warn{background:#fff2d9;color:#a36a0d}.pill.bad{background:#fde9e7;color:#b7433e}.pill.neutral{background:#eaf0f5;color:#526a7e}.link{border:0;background:none;color:var(--teal);font-weight:800;padding:5px}.link:hover{text-decoration:underline}.bar-track{height:9px;background:#e9eef1;border-radius:9px;overflow:hidden}.bar-fill{height:100%;background:var(--teal);border-radius:9px}.bar-fill.warn{background:var(--amber)}.bar-fill.bad{background:var(--red)}.legend{display:flex;gap:16px;color:var(--muted);font-size:11px;align-items:center}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.flow{display:flex;align-items:stretch;gap:8px;padding:10px 0 3px}.flow-node{flex:1;border:1px solid var(--line);border-radius:10px;padding:15px 12px;text-align:center;min-width:0}.flow-node .n{font-weight:800;font-size:19px;margin:8px 0 4px}.flow-node small{font-size:11px;color:var(--muted)}.flow-arrow{align-self:center;color:#8ca6b3;font-size:20px}.chart{display:flex;align-items:end;gap:6px;height:180px;padding:10px 0 0;border-bottom:1px solid #cad8e0}.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:3px;min-width:0}.chart-col .bars{width:100%;height:100%;display:flex;align-items:end;justify-content:center;gap:2px}.chart-col .bar{background:#15a69a;width:38%;min-height:2px;border-radius:3px 3px 0 0}.chart-col .bar.limit{background:#dfe8ed}.chart-col .bar.alert{background:#df8d39}.chart-col small{font-size:10px;color:var(--muted);height:17px;white-space:nowrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px;background:#f7f9fa}th,td{padding:13px 18px;border-bottom:1px solid #edf1f3}td{font-size:13px}tr:last-child td{border-bottom:0}td strong{font-size:13px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar select,.toolbar input{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:white;color:var(--ink)}.info{padding:14px 16px;border-radius:10px;background:#e9f4f3;color:#245f60;font-size:12px;line-height:1.5}.info.warn{background:#fff5e5;color:#875d19}.section-title{font-size:19px;letter-spacing:-.3px;margin:7px 0 14px}.result{padding:20px 22px}.result h3{margin:0 0 10px;font-size:18px}.result p{color:var(--muted);font-size:13px;line-height:1.55}.result ul{margin:12px 0 0;padding-left:20px;font-size:13px;line-height:1.9}.timeline{padding:2px 22px 20px}.event{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid #edf1f3}.event:last-child{border-bottom:0}.event-time{color:var(--muted);font-size:11px;width:115px;flex:none}.event-body{font-size:13px;line-height:1.45}.event-body strong{display:block;margin-bottom:3px}.event-body span{color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:700;color:#486071}.field input,.field select{width:100%;border:1px solid #cedbe2;border-radius:8px;padding:11px 12px;background:white}.field input:focus,.field select:focus{outline:2px solid #8bd3cb;outline-offset:1px}.modal-back{position:fixed;inset:0;background:rgba(8,26,39,.58);display:grid;place-items:center;z-index:10;padding:16px}.modal{width:min(520px,100%);background:#fff;border-radius:16px;box-shadow:0 20px 65px #071d2a55;padding:25px}.modal h2{margin:0 0 6px}.modal p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 20px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.empty{padding:32px;text-align:center;color:var(--muted);font-size:13px}.notice{position:fixed;right:25px;bottom:24px;background:#173c4c;color:white;border-radius:10px;padding:14px 17px;box-shadow:0 10px 30px #10253744;z-index:30;font-size:13px;max-width:390px}.hidden{display:none!important}.mini{font-size:11px;color:var(--muted)}.badge-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.scenario{display:flex;gap:12px;align-items:flex-start;padding:15px;border:1px solid var(--line);border-radius:10px}.scenario .step{width:25px;height:25px;display:grid;place-items:center;background:#dff2ee;color:#087e75;border-radius:50%;font-weight:800;font-size:12px;flex:none}.scenario strong{font-size:13px}.scenario p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
    @media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.app{grid-template-columns:72px 1fr}.side{padding:22px 10px}.brand{font-size:0;padding:0 8px}.side-caption,.side-bottom,.nav .text{display:none}.nav button{justify-content:center;padding:13px}.nav .ico{font-size:20px}}
    @media(max-width:680px){.app{display:block}.side{height:auto;padding:9px;display:flex;flex-direction:row;align-items:center;gap:8px;overflow:auto}.brand{display:none}.nav{display:flex}.nav button{width:42px}.top{height:auto;padding:13px 17px;align-items:flex-start}.top-actions{gap:5px}.role-select{width:148px;font-size:11px}.avatar{display:none}.content{padding:20px 16px 50px}.heading{display:block}.heading .btn{margin-top:15px}.heading h1{font-size:25px}.grid4,.grid3,.form-grid{grid-template-columns:1fr}.flow{overflow:auto}.flow-node{min-width:125px}.event-time{width:83px}.site-row,.object-row{flex-wrap:wrap}.row-num{margin-left:auto}}
  .heatmap{display:grid;gap:4px;overflow:auto}.heat-row{display:grid;grid-template-columns:145px repeat(12,1fr);gap:4px;align-items:center;min-width:700px}.heat-row span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.heat-row b{font-size:10px;color:var(--muted);text-align:center}.heat{height:18px;border-radius:4px;background:#43b7a8}.heat.good{background:#a7ddd5}.heat.suspect{background:#e5a13b}.heat.gap{background:#d76055}.heat-label{margin-bottom:2px}.topology{display:flex;align-items:center;gap:8px;overflow:auto;padding:6px 0}.topo-node{min-width:120px;padding:13px 10px;border:1px solid var(--line);border-radius:10px;text-align:center;background:#fbfdfd}.topo-node b{display:block;color:var(--teal);font-size:20px;margin-bottom:7px}.topo-node strong{display:block;font-size:12px}.topo-node span{display:block;font-size:10px;color:var(--muted);margin-top:4px}.topo-line{font-size:20px;color:#88a2af}</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="brand-mark">↯</span> Энергохаб</div>
    <div><div class="side-caption">Рабочее пространство</div><nav class="nav" id="nav"></nav></div>
    <div class="side-bottom">Демонстрационный прототип<br>2 площадки · данные за 24 часа<br><button class="link" style="color:#a6bdc9;padding:7px 0" data-reset>↺ Сбросить демонстрацию</button></div>
  </aside>
  <main><header class="top"><div class="crumb">Энергохаб / <span id="crumb"></span><strong id="topTitle"></strong></div><div class="top-actions"><select class="role-select" id="roleSelect" aria-label="Роль"><option value="admin">Администратор платформы</option><option value="owner">Владелец портфеля</option><option value="operator">Оператор хаба</option><option value="building">Собственник здания</option></select><div class="avatar" id="avatar">ВП</div></div></header><div class="content" id="content"></div></main>
</div>
<div id="modalRoot"></div><div id="notice" class="notice hidden"></div>
<script>
(()=>{
  const KEY='energyhub-demo-v1';
  const fmt=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
  const fmt1=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1});
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const now=()=>new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); let case6Meta=null;
  function series(base,seed){return Array.from({length:24},(_,h)=>Math.round(base*(.67+.30*Math.sin((h-7)*Math.PI/12)**2+.19*(h>=9&&h<=19)+.045*Math.sin(h*2.17+seed))))}
  function initial(){return {role:'owner',view:'overview',selectedSite:'north',selectedObject:'n1',query:null,events:[
    {time:'09.11, 09:42',title:'Пробел в телеметрии',detail:'БЦ «Север», счетчик M-102 · 2 часа без показаний',type:'quality',object:'n2'},
    {time:'09.11, 08:15',title:'Заявка на обслуживание открыта',detail:'БЦ «Север» · проверить связь со счетчиком M-102',type:'service',object:'n2'},
    {time:'08.11, 17:30',title:'Лимит обновлен',detail:'Технопарк «Речной» · 3 700 → 3 900 кВт·ч/сутки',type:'limit',object:null}
  ],services:[{id:'monitor',name:'Мониторинг энергопрофиля',status:'Подключен',level:'Площадка',target:'north',config:'Шаг 15 мин'},{id:'peak',name:'Peak shaving',status:'Активен',level:'Площадка',target:'river',config:'Лимит 390 кВт · 2 батареи'}],tickets:[{id:'T-204',object:'n2',status:'Открыта',issue:'Нет показаний счетчика M-102',time:'09.11, 08:15'}],sites:[
    {id:'north',name:'Площадка «Север»',address:'Москва · Ленинградский проспект, 37',icon:'▦'},
    {id:'river',name:'Площадка «Речная»',address:'Москва · Береговой проезд, 5',icon:'▤'}
  ],objects:[
    {id:'n1',site:'north',name:'Главный корпус',type:'Офисное здание',meter:'M-101',base:67,seed:1,limit:2050,quality:'ok',source:'Электросеть'},
    {id:'n2',site:'north',name:'БЦ «Север»',type:'Офисное здание',meter:'M-102',base:54,seed:2,limit:1510,quality:'gap',source:'Электросеть'},
    {id:'n3',site:'north',name:'Паркинг',type:'Инфраструктура',meter:'M-103',base:21,seed:3,limit:650,quality:'ok',source:'Электросеть'},
    {id:'r1',site:'river',name:'Технопарк «Речной»',type:'Производство',meter:'M-201',base:117,seed:4,limit:3900,quality:'ok',source:'Электросеть'},
    {id:'r2',site:'river',name:'Складской корпус',type:'Склад',meter:'M-202',base:37,seed:5,limit:1160,quality:'suspect',source:'Электросеть'}
  ]}}
  let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial()}catch{state=initial()}
  if(!state.services)state.services=initial().services;const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
  async function loadCase6(){try{const r=await fetch('data/case6-aggregated.json');if(!r.ok)return;case6Meta=await r.json();const keep=state.objects.filter(o=>o.id.startsWith('new'));const base=state.objects.filter(o=>!o.id.startsWith('new'));case6Meta.files.forEach((d,i)=>{let o=base[i];if(!o){o={id:'csv'+(i+1),site:i<3?'north':'river',name:d.node+' · '+(d.asset||'агрегат'),type:d.asset&&d.asset.includes('Group')?'Энергохаб':'Площадка',meter:'CSV-'+d.node,limit:Math.max(600,d.base*30),seed:i+10,quality:d.valid<d.rows?'gap':'ok',source:'case6 CSV'};base.push(o)}o.base=d.base;o.hourly=d.hourly;o.csvFile=d.file;o.period=d.period;o.source='case6 CSV · '+d.node;o.csvRows=d.rows;o.csvValid=d.valid;o.csvPV=d.avgPV;o.csvGrid=d.avgGrid});state.objects=[...base,...keep];save();render()}catch(e){console.warn('CSV demo data unavailable',e)}}
  const objects=site=>state.objects.filter(o=>!site||o.site===site);
  const getObj=id=>state.objects.find(o=>o.id===id);
  const getSite=id=>state.sites.find(s=>s.id===id);
  const readings=o=>o.hourly&&o.hourly.length===24?o.hourly:series(o.base,o.seed);
  const use=o=>readings(o).reduce((a,b)=>a+b,0);
  const sum=arr=>arr.reduce((n,o)=>n+use(o),0);
  const limit=arr=>arr.reduce((n,o)=>n+o.limit,0);
  const pct=(n,d)=>d?Math.round(n/d*100):0;
  const quality=arr=>arr.length?Math.round(arr.filter(o=>o.quality==='ok').length/arr.length*100):100;
  const qualityLabel=q=>q==='ok'?'Проверены':q==='gap'?'Пробел':'Аномалия';
  const qualityPill=q=>`<span class="pill ${q==='ok'?'good':q==='gap'?'bad':'warn'}">${qualityLabel(q)}</span>`;
  const limitPill=(u,l)=>`<span class="pill ${u>l?'bad':u/l>.9?'warn':'good'}">${u>l?'Превышен':u/l>.9?'Близко к лимиту':'В норме'}</span>`;
  const metric=(label,value,detail,kind='')=>`<div class="card metric"><div class="label">${label}</div><div class="value">${value}</div><div class="detail ${kind}">${detail}</div></div>`;
  const card=(title,sub,body,action='')=>`<section class="card"><div class="card-head"><div><div class="card-title">${title}</div><div class="card-sub">${sub}</div></div>${action}</div>${body}</section>`;
  const event=(title,detail,type,object)=>{state.events.unshift({time:now(),title,detail,type,object});save()};
  const notify=msg=>{const n=document.getElementById('notice');n.textContent=msg;n.classList.remove('hidden');setTimeout(()=>n.classList.add('hidden'),3500)};
  const navigate=(view,site,object)=>{state.view=view;if(site)state.selectedSite=site;if(object)state.selectedObject=object;state.query=null;save();render();window.scrollTo({top:0,behavior:'smooth'})};
  function nav(){const items=[['overview','◫','Обзор'],['sites','▦','Площадки'],['objects','▤','Объекты'],['services','◉','Сервисы'],['queries','⌕','Запросы'],['quality','◈','Качество данных'],['service','⚒','Обслуживание'],['history','◷','История изменений'],['map','⌖','Карта площадок'],['tariffs','₽','Тарифы'],['calendar','▣','Календарь'],['source','▥','Источники данных']];return items.map(([id,ico,name])=>`<button data-nav="${id}" class="${state.view===id||(['site','object'].includes(state.view)&&id===(state.view==='site'?'sites':'objects'))?'active':''}" title="${name}"><span class="ico">${ico}</span><span class="text">${name}</span></button>`).join('')}
  function header(kicker,title,subtitle,action=''){return `<div class="heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${subtitle}</p></div>${action}</div>`}
  function siteRows(){return state.sites.map(s=>{const os=objects(s.id),u=sum(os),l=limit(os);return `<div class="site-row"><div class="site-icon">${s.icon}</div><div class="row-main"><strong>${esc(s.name)}</strong><span>${esc(s.address)} · ${os.length} объекта</span></div><div class="row-num"><strong>${fmt.format(u)} кВт·ч</strong><span>из ${fmt.format(l)} кВт·ч</span></div>${limitPill(u,l)}<button class="link" data-site="${s.id}">Открыть →</button></div>`}).join('')}
  function objectRows(os){return os.map(o=>`<div class="object-row"><div class="object-icon">${o.type==='Инфраструктура'?'▣':'▤'}</div><div class="row-main"><strong>${esc(o.name)}</strong><span>${esc(getSite(o.site).name)} · ${esc(o.type)} · ${esc(o.meter)}</span></div><div class="row-num"><strong>${fmt.format(use(o))} кВт·ч</strong><span>лимит ${fmt.format(o.limit)}</span></div>${qualityPill(o.quality)}<button class="link" data-object="${o.id}">Дашборд →</button></div>`).join('')}
  function chart(os){const vals=Array.from({length:24},(_,h)=>os.reduce((a,o)=>a+readings(o)[h],0));const lim=limit(os)/24;const max=Math.max(...vals,lim)*1.12;return `<div class="chart" aria-label="Почасовое потребление и среднечасовой лимит">${vals.map((v,h)=>`<div class="chart-col" title="${h}:00 · ${fmt.format(v)} кВт·ч"><div class="bars"><div class="bar limit" style="height:${lim/max*100}%"></div><div class="bar ${v>lim?'alert':''}" style="height:${v/max*100}%"></div></div><small>${h%3===0?String(h).padStart(2,'0'):''}</small></div>`).join('')}</div><div class="legend" style="margin-top:11px"><span><i class="dot" style="background:#15a69a"></i>Потребление</span><span><i class="dot" style="background:#dfe8ed"></i>Среднечасовой лимит</span><span><i class="dot" style="background:#df8d39"></i>Выше лимита</span></div>`}
  function flow(os){const total=sum(os);const own=Math.round(total*.12),grid=total-own;return `<div class="flow"><div class="flow-node"><div class="label">Электросеть</div><div class="n">${fmt.format(grid)}</div><small>кВт·ч / сутки</small></div><div class="flow-arrow">→</div><div class="flow-node"><div class="label">Локальная генерация*</div><div class="n">${fmt.format(own)}</div><small>кВт·ч / сутки</small></div><div class="flow-arrow">→</div><div class="flow-node"><div class="label">Потребление</div><div class="n">${fmt.format(total)}</div><small>кВт·ч / сутки</small></div></div><div class="mini" style="margin-top:13px">* Расчетная доля для демонстрации; баланс: сеть + генерация = потребление.</div>`}
  function topology(os){return `<div class="topology"><div class="topo-node site"><b>▦</b><strong>Площадка</strong><span>2 sites</span></div><div class="topo-line">↔</div><div class="topo-node"><b>⚡</b><strong>Сеть</strong><span>Grid connection</span></div><div class="topo-line">→</div><div class="topo-node"><b>▣</b><strong>Потребление</strong><span>${os.length} assets</span></div><div class="topo-line">←</div><div class="topo-node"><b>☀</b><strong>Генерация</strong><span>PV · симуляция</span></div><div class="topo-line">↔</div><div class="topo-node"><b>▤</b><strong>Счетчики</strong><span>${os.length} channels</span></div></div>`}
  function overview(){let os=state.role==='building'?objects(state.selectedSite):state.objects;let title=state.role==='building'?getSite(state.selectedSite).name:'Портфель объектов';let bad=os.filter(o=>o.quality!=='ok').length;return header('Обзор · 9 ноября 2026',title,'Суточные показатели, лимиты и состояние телеметрии в одном представлении.',state.role==='owner'?'<button class="btn primary" data-add>＋ Добавить объект</button>':'')+`<div class="stack">${card('Визуальная модель энергохаба','Узлы, оборудование и направления потоков',`<div class="card-body">${topology(os)}</div>`)}<div class="grid4">${metric('Потребление за сутки',fmt.format(sum(os))+' кВт·ч',`${os.length} объектов · 2 площадки`)}${metric('Суточный лимит',fmt.format(limit(os))+' кВт·ч',`${pct(sum(os),limit(os))}% использовано`,sum(os)>limit(os)?'bad':'good')}${metric('Качество данных',quality(os)+'%',`${bad} объекта требуют внимания`,bad?'bad':'good')}${metric('Активные заявки',state.tickets.filter(t=>t.status!=='Закрыта').length,'Обслуживание и связь со счетчиками')}</div><div class="grid2">${card('Потребление по часам','Все значения выведены из показаний объектов',`<div class="card-body">${chart(os)}</div>`)}${card('Потоки энергии','Согласованный суточный баланс',`<div class="card-body">${flow(os)}</div>`)}</div>${state.role!=='building'?card('Площадки','Один клик открывает дашборд площадки',`<div class="site-list">${siteRows()}</div>`):card('Объекты площадки','Один клик открывает дашборд объекта',`<div class="object-list">${objectRows(os)}</div>`)}<div><h2 class="section-title">Три рабочих запроса</h2><div class="grid3">${queryCards()}</div></div></div>`}
  function queryCards(){return [['over','↗','Где превышен лимит?','Ранжирование объектов по отношению потребления к суточному лимиту.'],['gaps','◈','Где данные ненадежны?','Пробелы и подозрительные показания с маршрутом к обслуживанию.'],['changes','◷','Что изменилось?','Новые объекты, лимиты и события обслуживания в единой истории.']].map(([id,icon,title,desc])=>`<div class="card query-card"><div class="qicon">${icon}</div><strong>${title}</strong><p>${desc}</p><button class="link" data-query="${id}">Открыть запрос →</button></div>`).join('')}
  function sites(){return header('Структура портфеля','Площадки','У каждой площадки свой баланс, лимиты, объекты и качество данных.',state.role==='owner'?'<button class="btn primary" data-add>＋ Добавить объект</button>':'')+card('Две площадки','Согласованные агрегаты из показаний дочерних объектов',`<div class="site-list">${siteRows()}</div>`)}
  function site(){let s=getSite(state.selectedSite)||state.sites[0],os=objects(s.id);return header('Площадка / '+esc(s.name),esc(s.name),esc(s.address),state.role==='owner'?'<button class="btn primary" data-add>＋ Добавить объект</button>':'')+`<div class="stack"><div class="grid4">${metric('Потребление',fmt.format(sum(os))+' кВт·ч','За последние 24 часа')}${metric('Лимит',fmt.format(limit(os))+' кВт·ч',pct(sum(os),limit(os))+'% использовано')}${metric('Качество данных',quality(os)+'%',os.filter(o=>o.quality!=='ok').length+' проблемных объекта')}${metric('Объекты',os.length,'Подключенные счетчики: '+os.length)}</div><div class="grid2">${card('Почасовая нагрузка','Сумма объектов площадки',`<div class="card-body">${chart(os)}</div>`)}${card('Потоки энергии','Расчетный баланс площадки',`<div class="card-body">${flow(os)}</div>`)}</div>${card('Объекты','Откройте дашборд объекта в один клик',`<div class="object-list">${objectRows(os)}</div>`)}</div>`}
  function objectsPage(){const os=state.role==='building'?objects(state.selectedSite):state.objects;return header('Модель объектов','Объекты','Иерархия: площадка → объект → счетчик → почасовые показания.',state.role==='owner'?'<button class="btn primary" data-add>＋ Добавить объект</button>':'')+card('Каталог объектов',`${os.length} объектов · значения синхронизированы с дашбордами`, `<div class="object-list">${objectRows(os)}</div>`)}
  function object(){const o=getObj(state.selectedObject)||state.objects[0];const u=use(o),r=readings(o);let note=o.quality==='gap'?'Нет показаний в 09:00 и 10:00. Суточная оценка восстановлена по соседним часам.':o.quality==='suspect'?'Пик в 14:00 помечен как аномалия. Суточная оценка требует проверки.':'Все 24 почасовых показания прошли проверку.';return header('Объект / '+esc(getSite(o.site).name),esc(o.name),`${esc(o.type)} · счетчик ${esc(o.meter)} · ${esc(getSite(o.site).address)}`,`<div class="toolbar"><button class="btn" data-site="${o.site}">← К площадке</button>${state.role==='operator'?'<button class="btn primary" data-limit-object="'+o.id+'">Изменить лимит</button>':''}</div>`)+`<div class="stack"><div class="grid4">${metric('Потребление',fmt.format(u)+' кВт·ч','За последние 24 часа')}${metric('Суточный лимит',fmt.format(o.limit)+' кВт·ч',pct(u,o.limit)+'% использовано',u>o.limit?'bad':'good')}${metric('Качество данных',qualityPill(o.quality),o.quality==='ok'?'24 / 24 часов проверены':'Требуется действие')}${metric('Источник',esc(o.source),esc(o.meter)+' · шаг 15 мин')}${o.period?metric('Период CSV',esc(o.period.split(' — ')[0]||o.period),'96 строк · '+(o.csvValid||0)+' заполненных'):''}</div><div class="grid2">${card('Нагрузка по часам','Ряд счетчика '+esc(o.meter),`<div class="card-body">${chart([o])}</div>`)}${card('Потоки энергии','Баланс этого объекта',`<div class="card-body">${flow([o])}</div>`)}</div>${card('Проверка данных','Статус телеметрии и следующий шаг',`<div class="card-body"><div class="badge-line">${qualityPill(o.quality)} ${limitPill(u,o.limit)}</div><p class="sub" style="margin:14px 0">${note}</p>${o.quality!=='ok'?'<button class="btn primary" data-service-object="'+o.id+'">Перейти к обслуживанию →</button>':'<span class="mini">Последняя проверка: 09.11.2026, 10:00</span>'}</div>`)}${card('Почасовые показания','Один источник для графика, агрегатов и таблицы',`<div class="table-wrap"><table><thead><tr><th>Час</th><th>Потребление</th><th>Качество</th><th>Источник</th></tr></thead><tbody>${r.map((v,h)=>`<tr><td>${String(h).padStart(2,'0')}:00</td><td><strong>${fmt.format(v)} кВт·ч</strong></td><td>${(o.quality==='gap'&&[9,10].includes(h))?'Восстановлено':o.quality==='suspect'&&h===14?'Проверить':'Проверено'}</td><td>${esc(o.meter)}</td></tr>`).join('')}</tbody></table></div>`)}</div>`}
  function queries(){const all=state.role==='building'?objects(state.selectedSite):state.objects;let result='';if(state.query==='over'){const ranked=[...all].sort((a,b)=>use(b)/b.limit-use(a)/a.limit);result=card('Результат · превышения лимитов','Отсортировано по доле использованного лимита',`<div class="table-wrap"><table><thead><tr><th>Объект</th><th>Площадка</th><th>Потребление</th><th>Лимит</th><th>Статус</th></tr></thead><tbody>${ranked.map(o=>`<tr><td><button class="link" data-object="${o.id}">${esc(o.name)}</button></td><td>${esc(getSite(o.site).name)}</td><td>${fmt.format(use(o))} кВт·ч</td><td>${fmt.format(o.limit)} кВт·ч</td><td>${limitPill(use(o),o.limit)}</td></tr>`).join('')}</tbody></table></div>`)}else if(state.query==='gaps'){const bad=all.filter(o=>o.quality!=='ok');result=card('Результат · качество данных',`${bad.length} объекта требуют внимания`,bad.length?`<div class="object-list">${objectRows(bad)}</div>`:'<div class="empty">Все показания проверены.</div>')}else if(state.query==='changes'){result=historyBody(true)}return header('Аналитика по запросу','Три запроса','Один набор данных питает ответы, дашборды и историю.')+`<div class="stack"><div class="grid3">${queryCards()}</div>${result||'<div class="info">Выберите запрос выше, чтобы получить готовый ответ и перейти к исходному объекту.</div>'}</div>`}
  function servicesPage(){const connections=state.services||[];const row=(id,name,desc)=>{const c=connections.find(x=>x.id===id)||{status:'Не подключен',level:'—',target:'—',config:'—'};return card(name,desc,'<div class="card-body"><div class="badge-line"><span class="pill '+(c.status==='Активен'||c.status==='Подключен'?'good':'warn')+'">'+esc(c.status)+'</span><span class="pill neutral">'+esc(c.level)+'</span><span class="pill neutral">'+esc(c.config)+'</span></div><p class="sub" style="margin:14px 0">Цель: '+esc(getSite(c.target)?.name||getObj(c.target)?.name||c.target)+' · шаблон формируется из конфигурации.</p>'+(state.role==='admin'?'<button class="btn small primary" data-service-toggle="'+id+'">Настроить подключение</button>':'<span class="mini">Изменение подключения доступно администратору</span>')+'</div>')};return header('Каталог платформы','Сервисы','Два шаблона, подключения и параметры на уровнях хаба, площадки и оборудования. Источник: case6 CSV.')+'<div class="stack"><div class="grid2">'+row('monitor','Мониторинг энергопрофиля','Потребление · генерация · сеть · качество')+row('peak','Peak shaving','Лимит мощности · батареи · превышения')+'</div>'+card('Две конфигурации одного шаблона','Peak shaving', '<div class="card-body"><div class="grid2"><div class="info">Площадка «Речная» · 390 кВт · 2 батареи</div><div class="info">Главный корпус · 170 кВт · 1 батарея</div></div><p class="sub" style="margin-top:14px">Шаблон меняет линию лимита и состав оборудования по конфигурации подключения.</p></div>')+'</div>'}
  function heatmap(os){return `<div class="heatmap"><div class="heat-row heat-label"><span>Объект / час</span>${Array.from({length:12},(_,h)=>`<b>${String(h*2).padStart(2,'0')}</b>`).join('')}</div>${os.map(o=>`<div class="heat-row"><span title="${esc(o.name)}">${esc(o.name)}</span>${Array.from({length:12},(_,h)=>{let q=o.quality==='gap'&&h===5?'gap':o.quality==='suspect'&&h===7?'suspect':(h>7&&h<10?'good':'ok');return `<i class="heat ${q}" title="${esc(o.name)} · ${h*2}:00 · ${q==='gap'?'пропуск':q==='suspect'?'аномалия':'проверено'}"></i>`}).join('')}</div>`).join('')}</div><div class="legend" style="margin-top:10px"><span><i class="dot" style="background:#43b7a8"></i>Проверено</span><span><i class="dot" style="background:#e5a13b"></i>Аномалия</span><span><i class="dot" style="background:#d76055"></i>Пропуск</span></div>`}
  function limitModal(id){const o=getObj(id);if(!o)return;document.getElementById('modalRoot').innerHTML=`<div class="modal-back"><form class="modal" id="limitForm"><h2>Изменить лимит</h2><p>Оператор меняет ограничение мощности для ${esc(o.name)}. Старое и новое значение попадут в историю.</p><input type="hidden" name="id" value="${o.id}"><div class="field"><label>Новый лимит, кВт·ч/сутки</label><input name="limit" type="number" min="100" max="100000" value="${o.limit}" required></div><div class="modal-actions"><button type="button" class="btn" data-cancel>Отмена</button><button class="btn primary">Сохранить лимит</button></div></form></div>`}
  function serviceModal(kind){const peak=kind==='peak';const opts=state.sites.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');document.getElementById('modalRoot').innerHTML='<div class="modal-back"><form class="modal" id="serviceForm" data-kind="'+kind+'"><h2>'+(peak?'Настроить Peak shaving':'Настроить мониторинг энергопрофиля')+'</h2><p>Конфигурация сохраняется в истории и применяется к шаблонной визуализации.</p><div class="form-grid"><div class="field"><label>Уровень подключения</label><select name="level"><option>Площадка</option><option>Объект</option><option>Энергохаб</option></select></div><div class="field"><label>Целевой объект</label><select name="target">'+opts+'</select></div><div class="field"><label>'+(peak?'Лимит мощности, кВт':'Шаг данных, минут')+'</label><input name="config" value="'+(peak?390:15)+'" type="number" min="1"></div><div class="field"><label>Статус</label><select name="status"><option>Активен</option><option>Пауза</option></select></div></div><div class="modal-actions"><button type="button" class="btn" data-cancel>Отмена</button><button class="btn primary">Сохранить конфигурацию</button></div></form></div>'} 
  function qualityPage(){const all=state.role==='building'?objects(state.selectedSite):state.objects;return header('Телеметрия','Качество данных','Пробелы, аномалии, расчетные значения и действия по ним.')+`<div class="stack"><div class="grid4">${metric('Полные данные',all.filter(o=>o.quality==='ok').length+' / '+all.length,'Объектов без проблем')}${metric('Доля проверенных',quality(all)+'%','По статусу объектов')}${metric('Пробелы',all.filter(o=>o.quality==='gap').length,'Требуют проверки связи')}${metric('Аномалии',all.filter(o=>o.quality==='suspect').length,'Требуют сверки показаний')}</div><div class="info warn">Расчетные значения показаны везде одинаково: в карточке объекта, таблице, графике и агрегатах площадки. Статус качества остается видимым до подтверждения оператором.</div>${card('Тепловая карта качества','24 часа · шаг 2 часа · по объектам', '<div class=\"card-body\">'+heatmap(all)+'</div>')} ${card('Реестр качества','Оператор может открыть или завершить обслуживание',`<div class="table-wrap"><table><thead><tr><th>Объект</th><th>Счетчик</th><th>Статус</th><th>Объяснение</th><th>Действие</th></tr></thead><tbody>${all.map(o=>`<tr><td><button class="link" data-object="${o.id}">${esc(o.name)}</button></td><td>${esc(o.meter)}</td><td>${qualityPill(o.quality)}</td><td>${o.quality==='gap'?'2 часа восстановлены':o.quality==='suspect'?'Пик требует сверки':'24 часа проверены'}</td><td>${o.quality==='ok'?'—':`<button class="link" data-service-object="${o.id}">Обслуживание →</button>`}</td></tr>`).join('')}</tbody></table></div>`)}</div>`}
  function service(){const all=state.role==='building'?objects(state.selectedSite):state.objects;const open=state.tickets.filter(t=>t.status!=='Закрыта'&&all.some(o=>o.id===t.object));return header('Сценарий оператора','Обслуживание','От сигнала качества до закрытия заявки и записи в истории.')+`<div class="stack"><div class="grid3"><div class="scenario card"><div class="step">1</div><div><strong>Найти проблему</strong><p>Откройте объект с пробелом или аномалией в реестре качества.</p></div></div><div class="scenario card"><div class="step">2</div><div><strong>Создать или открыть заявку</strong><p>Привяжите действие к счетчику и объекту.</p></div></div><div class="scenario card"><div class="step">3</div><div><strong>Подтвердить данные</strong><p>Закройте заявку; качество и история обновятся во всех экранах.</p></div></div></div>${card('Открытые заявки',`${open.length} в работе`,open.length?`<div class="table-wrap"><table><thead><tr><th>Номер</th><th>Объект</th><th>Проблема</th><th>Статус</th><th>Действие</th></tr></thead><tbody>${open.map(t=>`<tr><td><strong>${t.id}</strong></td><td><button class="link" data-object="${t.object}">${esc(getObj(t.object)?.name||'—')}</button></td><td>${esc(t.issue)}</td><td>${esc(t.status)}</td><td>${state.role==='operator'?`<button class="btn small primary" data-close-ticket="${t.id}">Подтвердить и закрыть</button>`:'<span class="mini">Доступно оператору</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Открытых заявок нет.</div>')}${card('Сигналы без заявки','Создание заявки для другого проблемного объекта',`<div class="object-list">${objectRows(all.filter(o=>o.quality!=='ok'&&!state.tickets.some(t=>t.object===o.id&&t.status!=='Закрыта')))}</div>${all.filter(o=>o.quality!=='ok'&&!state.tickets.some(t=>t.object===o.id&&t.status!=='Закрыта')).length?'':'<div class="empty">Все сигналы уже в работе.</div>'}`)}</div>`}
  function mapPage(){return header("География","Карта площадок","Синтетические координаты и переход к площадке.")+card("Карта площадок","UTC+3 · координаты синтетические","<div class=\"card-body\"><div class=\"grid2\"><div class=\"info\">▦ Площадка «Север»<br>55.80, 37.57 · 3 объекта<br><button class=\"link\" data-site=\"north\">Открыть →</button></div><div class=\"info\">▤ Площадка «Речная»<br>55.75, 37.48 · 3 объекта<br><button class=\"link\" data-site=\"river\">Открыть →</button></div></div></div>")}
  function tariffs(){return header("Экономика","Тарифы","Демонстрационные интервалы и валюта.")+card("Тарифный календарь","₽/кВт·ч · 01.11–30.11.2026","<div class=\"card-body\"><div class=\"grid3\"><div class=\"scenario\"><strong>Ночь</strong><p>00:00–07:00<br>Покупка 4,20 ₽<br>Продажа 2,10 ₽</p></div><div class=\"scenario\"><strong>День</strong><p>07:00–17:00<br>Покупка 7,80 ₽<br>Продажа 3,40 ₽</p></div><div class=\"scenario\"><strong>Пик</strong><p>17:00–22:00<br>Покупка 11,60 ₽<br>Peak shaving</p></div></div></div>")}
  function calendar(){return header("Расписание","Календарь и режимы","Рабочие, выходные и праздничные интервалы.")+"<div class=\"grid3\"><div class=\"card query-card\"><strong>Рабочий день</strong><p>Пн–Пт · 08:00–20:00<br>390 кВт</p></div><div class=\"card query-card\"><strong>Выходной</strong><p>Сб–Вс<br>250 кВт</p></div><div class=\"card query-card\"><strong>Праздник</strong><p>04.11.2026<br>180 кВт</p></div></div>"}
  function source(){return header("Прозрачность","Источники данных","case6.zip · 6 CSV · шаг 15 минут.")+card("Правила качества","Пустая ячейка — пропуск, не ноль.","<div class=\"card-body\"><div class=\"info\">Показания агрегируются из outputs/data/raw/*.csv. case6-aggregated.json создается скриптом build-case6-data.js. Энергия — кВт·ч, мощность — кВт, часовой пояс UTC+3.</div></div>")}
  function historyBody(short=false){const events=state.role==='building'?state.events.filter(e=>!e.object||getObj(e.object)?.site===state.selectedSite):state.events;return card(short?'Результат · история изменений':'Журнал изменений',short?'Последние события':'Новые объекты, лимиты, качество и обслуживание',`<div class="timeline">${events.slice(0,short?8:99).map(e=>`<div class="event"><div class="event-time">${esc(e.time)}</div><div class="event-body"><strong>${esc(e.title)}</strong><span>${esc(e.detail)}</span></div>${e.object?`<button class="link" data-object="${e.object}">Объект →</button>`:''}</div>`).join('')}</div>`)}
  function history(){return header('Аудит','История изменений','Каждое действие в прототипе оставляет запись с объектом и временем.')+historyBody()}
  function render(){const names={overview:'Обзор',sites:'Площадки',site:'Площадка',objects:'Объекты',services:'Сервисы',map:'Карта площадок',tariffs:'Тарифы',calendar:'Календарь',source:'Источники данных',object:'Дашборд объекта',queries:'Запросы',quality:'Качество данных',service:'Обслуживание',history:'История изменений'};document.getElementById('nav').innerHTML=nav();document.getElementById('crumb').textContent=names[state.view]||'Обзор';document.getElementById('topTitle').textContent=state.role==='admin'?'Администратор платформы':state.role==='owner'?'Владелец портфеля':state.role==='operator'?'Оператор хаба':'Собственник здания';document.getElementById('roleSelect').value=state.role;document.getElementById('avatar').textContent=state.role==='admin'?'АП':state.role==='owner'?'ВП':state.role==='operator'?'ОП':'СЗ';const f={overview,sites,site,objects:objectsPage,services:servicesPage,map:mapPage,tariffs,calendar,source,object,queries,quality:qualityPage,service,history}[state.view]||overview;document.getElementById('content').innerHTML=f()}
  function addModal(){if(state.role!=='admin'&&state.role!=='owner'){notify('Добавление объекта доступно администратору и владельцу портфеля');return;}document.getElementById('modalRoot').innerHTML=`<div class="modal-back" id="modalBack"><form class="modal" id="addForm"><h2>Добавить объект</h2><p>Новый объект сразу появится на площадке, в портфеле, аналитике и истории.</p><div class="form-grid"><div class="field"><label for="newName">Название</label><input id="newName" name="name" required maxlength="48" placeholder="Например, Корпус Б"></div><div class="field"><label for="newSite">Площадка</label><select id="newSite" name="site">${state.sites.map(s=>`<option value="${s.id}" ${s.id===state.selectedSite?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label for="newType">Тип</label><select id="newType" name="type"><option>Офисное здание</option><option>Производство</option><option>Склад</option><option>Инфраструктура</option></select></div><div class="field"><label for="newLimit">Лимит, кВт·ч/сутки</label><input id="newLimit" name="limit" type="number" min="100" max="100000" value="1200" required></div><div class="field"><label for="newBase">Средняя нагрузка, кВт·ч/час</label><input id="newBase" name="base" type="number" min="1" max="4000" value="35" required></div><div class="field"><label for="newMeter">Номер счетчика</label><input id="newMeter" name="meter" required maxlength="24" placeholder="M-301"></div></div><div class="modal-actions"><button type="button" class="btn" data-cancel>Отмена</button><button class="btn primary" type="submit">Добавить и открыть</button></div></form></div>`;document.getElementById('newName').focus()}
  function addObject(form){const data=new FormData(form),name=String(data.get('name')).trim(),meter=String(data.get('meter')).trim(),base=Number(data.get('base')),lim=Number(data.get('limit'));if(!name||!meter||!Number.isFinite(base)||base<1||!Number.isFinite(lim)||lim<100)return;const id='new'+Date.now(),site=String(data.get('site')),o={id,site,name,type:String(data.get('type')),meter,base,limit:lim,seed:state.objects.length+6,quality:'ok',source:'Электросеть'};state.objects.push(o);state.selectedSite=site;state.selectedObject=id;event('Добавлен объект',`${name} · ${getSite(site).name} · счетчик ${meter}`,'object',id);document.getElementById('modalRoot').innerHTML='';navigate('object',site,id);notify('Объект добавлен: все представления обновлены')}
  function serviceFor(id){const o=getObj(id);if(!o)return;state.selectedObject=id;state.selectedSite=o.site;let t=state.tickets.find(t=>t.object===id&&t.status!=='Закрыта');if(!t&&o.quality!=='ok'&&state.role==='operator'){t={id:'T-'+(205+state.tickets.length),object:id,status:'Открыта',issue:o.quality==='gap'?'Нет показаний счетчика '+o.meter:'Проверить аномалию счетчика '+o.meter,time:now()};state.tickets.push(t);event('Заявка на обслуживание открыта',`${o.name} · ${t.issue}`,'service',id);notify('Заявка '+t.id+' создана')}else if(!t&&state.role!=='operator'){notify('Создание заявки доступно оператору')}navigate('service',o.site,id)}
  function closeTicket(id){if(state.role!=='operator')return;const t=state.tickets.find(x=>x.id===id);if(!t)return;t.status='Закрыта';const o=getObj(t.object);o.quality='ok';event('Заявка закрыта · данные подтверждены',`${t.id} · ${o.name} · ${o.meter}`,'quality',o.id);save();render();notify('Качество данных и история обновлены')}
  document.addEventListener('click',e=>{const el=e.target.closest('[data-nav],[data-site],[data-object],[data-query],[data-add],[data-cancel],[data-service-object],[data-close-ticket],[data-reset],[data-limit-object],[data-service-toggle]');if(!el)return;if(el.dataset.nav)navigate(el.dataset.nav);else if(el.dataset.site)navigate('site',el.dataset.site);else if(el.dataset.object){const o=getObj(el.dataset.object);navigate('object',o.site,o.id)}else if(el.dataset.query){state.query=el.dataset.query;state.view='queries';save();render();document.getElementById('content').scrollIntoView({behavior:'smooth'})}else if(el.hasAttribute('data-add'))addModal();else if(el.hasAttribute('data-cancel'))document.getElementById('modalRoot').innerHTML='';else if(el.hasAttribute('data-reset')){localStorage.removeItem(KEY);state=initial();render();notify('Демонстрация сброшена')}else if(el.dataset.limitObject){if(state.role==='operator')limitModal(el.dataset.limitObject);else notify('Изменение лимита доступно оператору')}else if(el.dataset.serviceToggle){if(state.role==='admin')serviceModal(el.dataset.serviceToggle);else notify('Подключение сервисов доступно администратору')}else if(el.dataset.serviceObject)serviceFor(el.dataset.serviceObject);else if(el.dataset.closeTicket)closeTicket(el.dataset.closeTicket)});
  document.addEventListener('submit',e=>{if(e.target.id==='addForm'){e.preventDefault();addObject(e.target)} if(e.target.id==='serviceForm'){e.preventDefault();const d=new FormData(e.target);const c=(state.services||[]).find(x=>x.id===e.target.dataset.kind)||state.services?.[0];if(c){c.status=String(d.get('status'));c.level=String(d.get('level'));c.target=String(d.get('target'));c.config=String(d.get('config'))+(c.id==='peak'?' кВт':' мин')}event('Изменена конфигурация сервиса',(c?.name||'Сервис')+' · '+String(d.get('status'))+' · '+String(d.get('level'))+' · '+String(d.get('config')),'service',null);document.getElementById('modalRoot').innerHTML='';save();render();notify('Конфигурация сервиса сохранена')} if(e.target.id==='limitForm'){e.preventDefault();const d=new FormData(e.target),o=getObj(d.get('id')),old=o.limit,n=Number(d.get('limit'));if(!Number.isFinite(n)||n<100||n>100000){notify('Лимит должен быть от 100 до 100 000 кВт·ч');return}o.limit=n;event('Изменен лимит',o.name+' · '+old+' → '+n+' кВт·ч/сутки','limit',o.id);document.getElementById('modalRoot').innerHTML='';save();render();notify('Лимит сохранен и добавлен в историю')} });
  document.getElementById('roleSelect').addEventListener('change',e=>{state.role=e.target.value;state.view='overview';state.query=null;save();render()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modalRoot').innerHTML=''});
  render();
  loadCase6();
})();
</script>
